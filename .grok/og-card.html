<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Oven — share card</title>
  <style>
    @font-face {
      font-family: "Fraunces";
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: url("og-fonts/fraunces-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Sans";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("og-fonts/ibmplex-latin.woff2") format("woff2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #120c08;
    }
    body {
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 1100px 480px at 8% -18%, rgba(196, 90, 40, 0.28), transparent 58%),
        radial-gradient(ellipse 900px 420px at 100% 0%, rgba(228, 177, 74, 0.14), transparent 52%),
        #120c08;
      color: #f3e6cc;
    }
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.85  0 0 0 0 0.55  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      mix-blend-mode: overlay;
    }
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(8, 5, 3, 0.55) 100%);
    }
    .oven {
      position: relative;
      width: 540px;
      height: 540px;
      border-radius: 50%;
      background:
        conic-gradient(from 210deg, #c45a28, #e4b14a, #f3e6cc, #8a5a22, #c45a28 72%, #e4b14a, #8a5a22, #c45a28);
      box-shadow:
        0 0 0 1px rgba(243, 230, 204, 0.18),
        0 18px 60px rgba(0, 0, 0, 0.55),
        0 0 80px rgba(196, 90, 40, 0.22);
      display: grid;
      place-items: center;
    }
    .oven::before {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 38%, #5a2a14 0 16%, #1e1510 42%, #120c08 72%);
      box-shadow:
        inset 0 0 0 10px #1e1510,
        inset 0 18px 40px rgba(0, 0, 0, 0.55),
        inset 0 -12px 28px rgba(228, 177, 74, 0.08);
    }
    .oven::after {
      content: "";
      position: absolute;
      inset: 78px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 58%, rgba(196, 90, 40, 0.55) 0%, transparent 42%),
        radial-gradient(circle at 32% 28%, rgba(243, 230, 204, 0.16), transparent 36%);
      box-shadow: inset 0 0 0 2px rgba(228, 177, 74, 0.18);
      pointer-events: none;
    }
    .lockup {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 70%;
    }
    .cookie {
      width: 36px;
      height: 36px;
      margin: 0 auto 18px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: 88px;
      letter-spacing: -0.03em;
      line-height: 0.92;
      color: #f3e6cc;
      text-shadow: 0 2px 16px rgba(18, 12, 8, 0.85), 0 0 36px rgba(196, 90, 40, 0.35);
    }
    .rule {
      width: 72px;
      height: 2px;
      margin: 16px auto 14px;
      background: linear-gradient(90deg, transparent, #e4b14a, transparent);
      border-radius: 2px;
    }
    p {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: 0.14em;
      color: #e4b14a;
      text-shadow: 0 1px 10px rgba(18, 12, 8, 0.8);
    }
    .handle {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      width: 92px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(180deg, #f3e6cc, #e4b14a 40%, #8a5a22);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="oven" aria-hidden="true">
    <div class="lockup">
      <svg class="cookie" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="13" fill="none" stroke="#e4b14a" stroke-width="2.4"/>
        <circle cx="16" cy="16.2" r="8.2" fill="#e4b14a"/>
        <circle cx="13.2" cy="14.4" r="1.7" fill="#120c08"/>
        <circle cx="19.2" cy="14.8" r="1.45" fill="#120c08"/>
        <circle cx="15.2" cy="19.4" r="1.55" fill="#120c08"/>
      </svg>
      <h1>THE OVEN</h1>
      <div class="rule"></div>
      <p>Cookie Chain cApp</p>
    </div>
    <div class="handle"></div>
  </div>
  <div class="vignette"></div>
</body>
</html>
